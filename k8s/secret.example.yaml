# Copy to secret.yaml and fill in whichever providers you actually have keys
# for. secret.yaml is gitignored — never commit real keys. Any provider left
# blank simply shows as "not configured" in the UI; Ollama needs no key.
apiVersion: v1
kind: Secret
metadata:
  name: provider-keys
  namespace: research
type: Opaque
stringData:
  OPENAI_API_KEY: ""
  ANTHROPIC_API_KEY: ""
  GOOGLE_API_KEY: ""
  XAI_API_KEY: ""
