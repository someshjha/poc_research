apiVersion: apps/v1
kind: Deployment
metadata:
  name: simulation
  namespace: research
spec:
  replicas: 1
  selector:
    matchLabels: { app: simulation }
  template:
    metadata:
      labels: { app: simulation }
    spec:
      containers:
        - name: simulation
          image: research/simulation:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet: { path: /healthz, port: 8000 }
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: simulation
  namespace: research
spec:
  selector: { app: simulation }
  ports:
    - port: 8000
      targetPort: 8000
