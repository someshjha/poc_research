apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: research-ingress
  namespace: research
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    # A full six-stage run (multiple real model calls, some 20-30s each) can
    # comfortably exceed nginx's default 60s proxy timeout — the backend
    # would keep working and finish, but the browser's connection gets cut
    # and the UI never sees the response. Observed directly while testing
    # against real provider latency; 10 minutes covers a slow real run.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /api/orchestrator(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service: { name: orchestrator, port: { number: 8000 } }
          - path: /api/gateway(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service: { name: gateway, port: { number: 8000 } }
          - path: /api/retrieval(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service: { name: retrieval, port: { number: 8000 } }
          - path: /api/simulation(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service: { name: simulation, port: { number: 8000 } }
          - path: /()(.*)
            pathType: ImplementationSpecific
            backend:
              service: { name: frontend, port: { number: 8080 } }
