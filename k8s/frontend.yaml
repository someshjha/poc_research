apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: research
spec:
  replicas: 1
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      containers:
        - name: frontend
          image: research/frontend:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: research
spec:
  selector: { app: frontend }
  ports:
    - port: 8080
      targetPort: 8080
